#
# The bars themselves live in bossbars.yml. Colours take & codes and hex, as &#FFAA00.
RealBossbar:
  Prefix: "&fReal&5Bossbar &7|"
  Check-for-Updates: true
  # On servers that have dialogs (1.21.6 and up), edit bars and ask for typed input in dialogs
  # instead of inventories and the chat.
  useDialogs: true
  # Ticks between bar updates: how smoothly animations move. 20 ticks are a second.
  Update-Interval: 2
  # Ticks between working out again who should see which bar, for audiences with permissions and
  # placeholders that change. Joining, leaving and changing world are applied straight away.
  Visibility-Check: 20
  # Ticks between reading a title's placeholders again. Title frames still change on time.
  Placeholder-Refresh: 20
  # No bar shows in these worlds, whatever its own worlds say.
  Disabled-Worlds:
    - disabledWorldExample

# Temporary bars sent with /rbb announce, or by other plugins through the API.
Announcements:
  Color: YELLOW
  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12 or SEGMENTED_20
  Style: SOLID
  # Announcements never show in these worlds.
  Disabled-Worlds:
    - disabledWorldExample

Version: 1
