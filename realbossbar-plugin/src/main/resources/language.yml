Bossbar:
  Created: "&fCreated the bossbar &d%name%&f."
  Deleted: "&fDeleted the bossbar &d%name%&f."
  Not-Found: "&cThere's no bossbar called &f%name%&c."
  Already-Exists: "&cThere's already a bossbar called &f%name%&c."
  Invalid-Name: "&cA bossbar's name can only have letters, numbers, &f- &cand &f_&c, up to 32 of them."
  # %value% is what changed, such as "colour RED"
  Updated: "&fUpdated &d%name%&f: %value%&f."
  Enabled: "&d%name% &fis now &aenabled&f."
  Disabled: "&d%name% &fis now &cdisabled&f."
  Reset: "&fRestarted the animation of &d%name%&f."
  World-Enabled: "&d%name% &fnow shows in &b%world%&f."
  World-Disabled: "&d%name% &fno longer shows in &b%world%&f."
  Invalid-Audience: "&cCan't read &f%value%&c. Use &fall&c, &fperm:<permission> &cor &fplayers:<name>,<name>&c."
  Invalid-Progress: "&cProgress goes from &f0 &cto &f100&c."
  Shown: "&fShowing &d%name% &fto &b%value% &fplayer(s)."
  Hidden: "&fHid &d%name% &ffrom &b%value% &fplayer(s)."
  Toggle-On: "&fBossbars are &ashown &fagain."
  Toggle-Off: "&fBossbars are now &chidden&f."
  Toggle-Bar-On: "&d%name% &fis &ashown &fagain."
  Toggle-Bar-Off: "&d%name% &fis now &chidden&f."
  # /rbb toggle <bar> while every bar is hidden with /rbb toggle
  Toggle-Bar-Hiding-All: "&d%name% &fis no longer hidden by itself, but every bossbar still is. &7Show them again with &f/rbb toggle&7."
  Announced: "&fAnnounced to &b%value% &fplayer(s)."
  List-Header: "&fBossbars &7(%value%)&f:"
  # %value% is the bar's state: Status-On or Status-Off
  List-Entry: " &7- %value% &d%name% &7%info%"
  List-Empty: "&cThere are no bossbars yet. Make one with &f/rbb create <name>&c."
  Status-On: "&a●"
  Status-Off: "&c●"

Editor:
  List-Title: "&5Bossbars"
  Create: "&aCreate a bossbar"
  # The two title lines shown while a new bar's name is typed in chat.
  Create-Prompt:
    - "&6Type in the chat"
    - "&fthe new bossbar's name. &7Type 'cancel' to cancel."
  Title: "&5Edit &d%name%"
  Enabled: "&fEnabled: %value%"
  Titles: "&fTitles"
  Color: "&fColour: &b%value%"
  Style: "&fStyle: &b%value%"
  Animation: "&fAnimation: &b%value%"
  Progress-Percent: "&fProgress: &b%value%%"
  Duration: "&fAnimation seconds: &b%value%"
  Placeholder: "&fProgress placeholder: &b%value%"
  Audience: "&fAudience: &b%value%"
  Worlds: "&fWorlds"
  Restart: "&fRestart the animation"
  Delete: "&cDelete"
  Delete-Title: "&4Delete &d%name%&4?"
  Delete-Confirm: "&fDelete &d%name%&f? This can't be undone."
  Back: "&7Back"
  Pick-Color: "&5Colour of &d%name%"
  Pick-Style: "&5Style of &d%name%"
  Pick-Animation: "&5Animation of &d%name%"
  # The line under each animation in its picker.
  Animations:
    STATIC: "&7Stays at its progress."
    DECREASE: "&7Empties once, then stays empty: a countdown."
    INCREASE: "&7Fills once, then stays full."
    LOOP: "&7Empties from full, over and over."
    BOUNCE: "&7Fills and empties, back and forth."
  Titles-Title: "&5Titles of &d%name%"
  Frame: "&fFrame &b%value%"
  Add-Frame: "&aAdd a frame"
  Replace-Frames: "&fType every frame"
  Title-Interval: "&fTicks per frame: &b%value%"
  Last-Frame: "&cA bossbar needs at least one title."
  Audience-Title: "&5Audience of &d%name%"
  Audience-All: "&fEveryone"
  Audience-Permission: "&fWhoever has a permission"
  Audience-Players: "&fSome players"
  Players-Title: "&5Who sees &d%name%"
  Add-Player: "&aAdd a player by name"
  Last-Player: "&cThe audience needs at least one player. Pick another audience instead."
  Invalid-Player: "&f%value% &cisn't a player's name."
  Worlds-Title: "&5Worlds of &d%name%"
  All-Worlds: "&fEvery world: %value%"
  Type-Worlds: "&fType the worlds"
  Items:
    Previous: "&6Previous page"
    Next: "&aNext page"
    Close: "&cClose"
    Yes: "&aYes"
    No: "&cNo"
    Bar-Entry:
      - "&7%info%"
      - ""
      - "&7Left-click to edit."
      - "&7Right-click to turn it on or off."
    Click-Toggle: "&7Click to turn it on or off."
    Click-Change: "&7Click to change."
    Click-Type: "&7Click, then type it in chat."
    Click-Select: "&7Click to choose."
    Selected: "&aSelected"
    Current-Title: "&7Showing now: &r%value%"
    Progress-Lore:
      - "&7What a static bar shows."
      - "&7Left-click &a+10%&7, right-click &c-10%&7."
      - "&7Shift for 1% at a time."
    Duration-Lore:
      - "&7How long one run of the animation takes."
      - "&7Left-click &a+1s&7, right-click &c-1s&7."
      - "&7Shift for ten at a time."
    Click-Placeholder:
      - "&7Read for each player instead of the"
      - "&7animation, such as &b%player_health%/20&7."
      - ""
      - "&7Click, then type it in chat."
      - "&7Right-click to clear it."
    Click-Interval:
      - "&7Left-click &a+1&7, right-click &c-1&7."
      - "&7Shift for ten at a time."
    Click-Frame:
      - "&7Left-click to change it."
      - "&7Right-click to move it earlier."
      - "&7Shift-right-click to remove it."
    Click-Frames:
      - "&7Click, then type them in chat,"
      - "&7split by &b|&7. They replace every frame."
    Click-Permission: "&7Click, then type the permission in chat."
    Click-Players: "&7Click to pick the players."
    Player-In: "&aSees the bar. &7Click to take them out."
    Player-Out: "&7Doesn't see it. Click to add them."
    World-Shown: "&aShows here."
    World-Unlisted: "&7Not one of its worlds."
    World-Disabled: "&cNever shows here."
    World-Unloaded: "&8Not loaded."
    All-Worlds-Lore:
      - "&7On, it shows in every world but"
      - "&7the ones turned off, new ones too."
      - "&7Off, only in the worlds turned on."
    Worlds-Lore:
      - "&7Shows in: &b%value%"
      - "&7Never in: &b%info%"
    Type-Worlds-Lore:
      - "&7Click, then type them in chat, comma"
      - "&7separated. Worlds not loaded yet work too."
  # The two title lines shown while something is typed in chat.
  Type-Title:
    - "&6Type in the chat"
    - "&fthe titles, frames split by |. &7Type 'cancel' to cancel."
  Type-Frame:
    - "&6Type in the chat"
    - "&fthe frame. &7Type 'cancel' to cancel."
  Type-Placeholder:
    - "&6Type in the chat"
    - "&fthe progress placeholder. &7Type 'cancel' to cancel."
  Type-Permission:
    - "&6Type in the chat"
    - "&fthe permission. &7Type 'cancel' to cancel."
  Type-Player:
    - "&6Type in the chat"
    - "&fthe player's name. &7Type 'cancel' to cancel."
  Type-Worlds:
    - "&6Type in the chat"
    - "&fthe worlds, comma separated, * for all. &7Type 'cancel' to cancel."

System:
  # Shown to ops and realbossbar.admin on joining, when SpigotMC has a newer version.
  New-Update: "&6&lWARNING! &r&fThere is a new update available for RealBossbar: &b%value%&f. %name%"
  # The two title lines shown while the plugin is waiting for something to be typed in chat.
  Type-Input:
    - "&6Type in the chat"
    - "&fwhat you want to search for. &7Type 'cancel' to cancel."
  Input-Cancelled: "&cInput cancelled."
  Error-Occurred: "&cAn error occurred."
  Reloaded: "&aReloaded!"
  Player-Only: "&cCommand can't be used in the console!"
  Error-Permission: "&cYou don't have permission to execute this command!"
  Error-Command: "&cThe command you're trying to use doesn't exist."
  Error-Usage: "&cWrong usage for the command!"

Version: 2
